name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'          # weekly CodeQL run (Monday 06:23 UTC)

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: AZapata27/reusable-workflows/.github/workflows/java-gradle.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read
    with:
      java-version: '21'
      gradle-args: build --no-daemon

  workflow-lint:
    uses: AZapata27/reusable-workflows/.github/workflows/workflow-lint.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read

  security:
    uses: AZapata27/reusable-workflows/.github/workflows/security.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read
      actions: read               # CodeQL (required even when skipped; see ADR 0003)
      security-events: write      # CodeQL SARIF upload
    with:
      codeql-languages: '["java-kotlin", "actions"]'
      codeql-build-mode: none
